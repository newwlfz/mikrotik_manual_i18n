name: Build and deploy site

# 英文站（本仓库）是**总管**：
#   1. build + deploy：把 docs/ 构建成英文站，部署到
#      https://newwlfz.github.io/mikrotik_manual_i18n/ ；
#   2. publish-content：把 `tools/content/publish.mjs` 的 CONTENT_ROOTS（docs/、
#      versioned_docs/、hardware/、blog/、changelog/、data/、sidebars.ts、
#      sidebars-hardware.ts、versioned_sidebars/、versions.json）与 locales.json
#      推到各语种仓（当前是 `mikrotik_manual_zh_hans`），由对方的工作流完成
#      translate + build + deploy。跨仓写入用 fine-grained PAT（secret
#      `CROSS_REPO_TOKEN`），不受本仓 `permissions` 的限制；本仓权限仍是
#      `contents: read`。
#
# 语种清单与各语种部署地址在仓库根的 `locales.json`，不要在这里再加一份。
# 架构与失败隔离见 guides/ARCHITECTURE-MULTISITE.md。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: '只推送内容根 + locales.json 到语种仓（跳过本仓 build/deploy）'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 官方模板用 false：true 会在新 push 时取消正在进行的部署，
# 留下「artifact 已上传但 deploy 被砍」的中间态。
concurrency:
  group: pages
  cancel-in-progress: false

# 站点身份仍可用环境变量覆盖（`locales.json` 已给出同样的默认值，这里显式写
# 出来是为了让本仓的部署地址一眼可见，也方便 fork 改地址）。
env:
  SITE_LOCALE: en
  SITE_URL: https://newwlfz.github.io
  BASE_URL: /mikrotik_manual_i18n/
  LOCALE_EN_URL: https://newwlfz.github.io
  LOCALE_EN_BASE_URL: /mikrotik_manual_i18n/
  # 其它语种站点的地址全部来自 `locales.json`。`LOCALE_<X>_*` 只按主语言子标签
  # 匹配（`zh-Hans`、`zh-Hant` 都命中 `ZH`），在这里写 `LOCALE_ZH_BASE_URL` 会让
  # 简体、繁体的语言下拉和 `hreflang` 都指向简体站；要覆盖中文站地址请用本地预览，
  # 不要写进工作流。
  # 静态渲染是峰值；6 GiB 堆在 16 GiB 的 runner 上留足余量。
  BUILD_HEAP_MB: '6144'
  # 注：`${{ runner.temp }}` 只在 job/step 级 env 可用，workflow 级 env 用了会
  # 让整个 workflow 变成 invalid（run 直接失败且没有 job）。npm 缓存目录在
  # 下面三个 step 里各自注入 NPM_CONFIG_CACHE。

jobs:
  build:
    runs-on: ubuntu-latest
    # 手动 publish_only：内容发布不依赖本仓构建产物，跳过 13–14 分钟的构建。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_only != true }}
    # 构建约 13–14 分钟（6 GiB 堆）；默认 360 分钟过于宽松，卡住时要等 6 小时。
    timeout-minutes: 45
    env:
      # 本仓是**资源宿主**：语种站通过 ASSET_ORIGIN 引用这里的 /img、/assets、
      # /videos。`ASSET_HOST` 让 slim 保留完整的 build/img（约 99 MiB）——英文
      # 页面的 Markdown 图片走 assets/images，`/img` 本来可以剪掉，但中文站的
      # Markdown 图片指向 `/img/<hash>`，剪掉就会 404。见 guides/CI.md「Shared
      # assets」。
      ASSET_HOST: 'true'
    steps:
      - uses: actions/checkout@v4
      # `.npmrc` 把缓存指到 ../work/npm-cache（本地便利）；CI 改用 runner 临时
      # 目录，并让 setup-node 的 cache: npm 与 npm ci 看到同一个路径。
      # setup-node 的 cache: npm 会先解析缓存目录；先建出来，避免空目录判断。
      - name: Prepare npm cache directory
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: mkdir -p "$NPM_CONFIG_CACHE"
      - uses: actions/setup-node@v4
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
      # 单语种构建：CLI 数据 → Docusaurus（--locale en）→ Pagefind → llms.txt。
      - name: Build site
        run: npm run build
      # 部署前门禁：先 slim（ASSET_HOST=true 时保留完整 build/img），再跑
      # asset-refs / base-url-refs / orphan-assets / llms-links 四条断言。
      # slim 会按 BASE_URL 重写绝对 URL，所以必须与 build 看到同一组环境变量。
      - name: Slim and verify deploy shape
        run: npm run verify:deploy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Report artifact size
        run: du -sh build && find build -type f | wc -l

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish-content:
    # 内容同步与本仓构建**解耦**：
    #   - push 到 main：即使 build 失败也执行（内容根与 locales.json 是语种仓的
    #     输入，本仓构建失败可能只是资源/页面问题；语种仓自己的 build 是第二道
    #     门禁，失败时它不会部署）；
    #   - workflow_dispatch + publish_only：build 被跳过，这里仍可用（修 secret、
    #     或只想重推内容时不必等 13 分钟的构建）。
    needs: build
    if: ${{ always() && (github.ref == 'refs/heads/main' || inputs.publish_only == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # 只读本仓；跨仓写入由 `CROSS_REPO_TOKEN`（PAT）完成。
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 先校验登记表：地址或仓库写错时立刻停，而不是 clone 到一半才失败。
      - name: Validate locale registry
        run: npm run locales:check
      # secret 未设置时给出**明确错误**（带配置步骤），绝不静默跳过：静默跳过
      # 会让语种站停在旧内容上，而下一次 push 看起来一切正常。
      - name: Check CROSS_REPO_TOKEN
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          set -eu
          if [ -z "${CROSS_REPO_TOKEN:-}" ]; then
            echo "::error title=CROSS_REPO_TOKEN is not set::发布内容需要 fine-grained PAT（Contents: Read and write，覆盖 locales.json 里的语种仓）。在 Settings → Secrets and variables → Actions 添加 secret CROSS_REPO_TOKEN；申请与权限见 guides/ARCHITECTURE-MULTISITE.md。"
            exit 1
          fi
          echo "[publish] CROSS_REPO_TOKEN is present"
      - name: Publish content to language repositories
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: node tools/content/publish.mjs
