name: Release locale skeleton

# 发布“语种仓库骨架”Release：从 templates/locale-repo 的**工作树**打包（HEAD
# 还是旧骨架），同时发布 manifest.json（源 commit/状态、hub 常量、11 个占位符、
# 每个文件的 SHA-256、tar.gz 摘要）。
#
# 触发：手动指定版本，或推 skeleton-v* tag。tag 已存在对应 Release 时用
# --clobber 覆盖同名资产，便于修正骨架后重跑；concurrency 保证不并发写同一 Release。
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 'Skeleton version / release tag (e.g. skeleton-v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'skeleton-v*'

permissions:
  contents: write # gh release create / upload

concurrency:
  group: release-skeleton
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for the source commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与 pages.yml / sync.yml 一致：把 npm cache 放到 runner 临时目录，
      # 让 setup-node 与 npm ci 看到同一个路径。
      - name: Prepare npm cache directory
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: mkdir -p "$NPM_CONFIG_CACHE"

      - name: Set up Node
        uses: actions/setup-node@v4
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache

      # 共享工具链 parity：新增的打包脚本位于 tools/content/（已白名单 hub-only），
      # 因此它不会改变这条门禁的 unexpected 计数。
      - name: Check shared toolchain parity
        run: npm run check:tools-template

      # 必备骨架文件断言：缺失时直接失败，不自行修模板。
      - name: Assert required skeleton files
        run: node tools/content/release-skeleton.mjs --check-required

      - name: Build skeleton archive and manifest
        id: build
        env:
          SKELETON_VERSION: ${{ inputs.version || github.ref_name }}
        run: node tools/content/release-skeleton.mjs --version "$SKELETON_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          RELEASE_ASSET: ${{ steps.build.outputs.asset }}
          RELEASE_MANIFEST: ${{ steps.build.outputs.manifest }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Re-run after fixing the skeleton: same tag, replace both assets.
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_MANIFEST" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_MANIFEST" \
              --title "$RELEASE_TAG" \
              --notes "Locale repository skeleton $RELEASE_VERSION, built from templates/locale-repo. The .manifest.json records the source commit, hub constants, 11 placeholders and per-file SHA-256."
          fi
