# 已知译文（known translations）
#
# 这里放“翻译记忆里没有、模型也翻不动”的块，由
# `tools/translate/apply-known-translations.mjs` 在 apply/derive 链尾强制替换。
#
# 为什么需要它：`translate apply` 与 `translate derive` 都用 TM 逐块重建正文，
# 没有 TM 条目的块只能留在英文；`:::info` 这类容器一旦只翻了第一段，就会变成
# “中文 + 英文”的混合块，`verify` 也看不出它整体是英文。
# `config/translation-patches/<locale>/**` 里的 `replace` 只被 apply 读取，derive
# 之后不会重新应用，所以把规则集中到这份文件，链尾再跑一次即可收敛。
#
# 顶层键就是语种（与 `docusaurus.config.ts` 的 `i18n.locales` 同名），脚本按
# `--locale=` 取对应那一组；新增语种时加一组键即可，schema 不变。
#
#   schema: 1
#   <locale>:                          # 例如 zh-Hans
#     - paths: ["<overlay 相对路径>"]   # 可选；省略即全站
#       from: "<英文原文，必须与 overlay 里的字节一致>"
#       to: "<审核过的译文>"
#
# `from` 匹配不到任何页面时是空操作，所以同一条规则可以同时覆盖三个版本。
schema: 1

