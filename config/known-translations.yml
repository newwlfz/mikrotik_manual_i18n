  # 用户报告第 4 条：traffic-generator 的第二个 :::info 段落。
  # 第一段（嗅探工具抓不到生成的数据包）早就有中文，第二段（设备模式默认禁用）
  # 一直是英文，导致整个 info 容器中英混排。
  #
  # 两段 `from`：`normalize-links` 会把 `[Change device-mode]` 的链接文字换成目标
  # 页的中文标题（`[设备模式]`），而它排在这一步之前，所以落到链尾的可能是两种
  # 形态；第二条命中后第一条自然不再匹配，重复执行仍收敛。
  - paths:
      - diagnostics-monitoring-and-troubleshooting/traffic-generator.md
    from: "Because this tool can be used maliciously, it is disabled by default in every [设备模式](../system-information-and-utilities/device-mode.md). While `traffic-gen` is disabled, `quick` fails with a `not allowed by device-mode` error. Run `/system/device-mode/print` to check the current value. To enable it, run `/system/device-mode/update traffic-gen=yes` and confirm the change within the activation timeout (5 minutes by default) with physical access to the device: press the reset or mode button, or unplug the power. The device reboots after the confirmation; a regular reboot cancels the change. See [设备模式](../system-information-and-utilities/device-mode.md#change-device-mode)."
    to: "由于该工具可能被恶意使用，它在每种 [设备模式](../system-information-and-utilities/device-mode.md) 下默认处于禁用状态。当 `traffic-gen` 处于禁用状态时，`quick` 会以 `not allowed by device-mode` 错误失败。运行 `/system/device-mode/print` 可以查看当前值。若要启用，请运行 `/system/device-mode/update traffic-gen=yes`，并在激活超时时间（默认 5 分钟）内通过设备上的物理操作确认更改：按下复位按钮或 mode 按钮，或拔掉电源。确认后设备会重启；普通重启会取消该更改。参见 [更改 device-mode](../system-information-and-utilities/device-mode.md#change-device-mode)。"
    note: "user report #4: traffic-generator :::info 第二段（设备模式），链接文字已本地化"
  - paths:
      - diagnostics-monitoring-and-troubleshooting/traffic-generator.md
    from: "Because this tool can be used maliciously, it is disabled by default in every [设备模式](../system-information-and-utilities/device-mode.md). While `traffic-gen` is disabled, `quick` fails with a `not allowed by device-mode` error. Run `/system/device-mode/print` to check the current value. To enable it, run `/system/device-mode/update traffic-gen=yes` and confirm the change within the activation timeout (5 minutes by default) with physical access to the device: press the reset or mode button, or unplug the power. The device reboots after the confirmation; a regular reboot cancels the change. See [Change device-mode](../system-information-and-utilities/device-mode.md#change-device-mode)."
    to: "由于该工具可能被恶意使用，它在每种 [设备模式](../system-information-and-utilities/device-mode.md) 下默认处于禁用状态。当 `traffic-gen` 处于禁用状态时，`quick` 会以 `not allowed by device-mode` 错误失败。运行 `/system/device-mode/print` 可以查看当前值。若要启用，请运行 `/system/device-mode/update traffic-gen=yes`，并在激活超时时间（默认 5 分钟）内通过设备上的物理操作确认更改：按下复位按钮或 mode 按钮，或拔掉电源。确认后设备会重启；普通重启会取消该更改。参见 [更改 device-mode](../system-information-and-utilities/device-mode.md#change-device-mode)。"
    note: "user report #4: traffic-generator :::info 第二段（设备模式）"

