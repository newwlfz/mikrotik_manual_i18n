replace:
  - from: "In P2P setups the network address is the same as the other endpoint's local address."
    to: "在 P2P 设置中，网络地址将与其他端点的本地地址相同。"
  - from: "**Important:** As with any other PPP tunnel, SSTP also supports BCP which allows it to bridge the SSTP tunnel with a local interface. For example, in setups where routers are connected to the Internet through ether1 and workstations and laptops are connected to ether2, both local networks are routed through the SSTP client and they are not in the same broadcast domain. BCP is used."
    to: "**重要：** 与任何其他 PPP 隧道一样，SSTP 也支持 BCP，这允许它将 SSTP 隧道与本地接口桥接。例如，在路由器通过 ether1 连接到互联网、工作站和笔记本电脑连接到 ether2 的设置中，两个本地网络都通过 SSTP 客户端路由，并且它们不在同一广播域中。此处使用了 BCP。"
