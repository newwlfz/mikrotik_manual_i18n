# Translation policy.
#
# The endpoint, model, API key, timeout and retry budget are connection
# settings, not repository policy: they come from LLM_* (see
# `tools/translate/lib/llm-config.mjs`, `guides/LLM.md` and
# `.env.local.example`). They are never stored in this file.
schema: 1

# Provenance label written to an overlay's `translation_provider` front matter.
# The wire protocol is always OpenAI chat-completions; this only names who
# produced the wording.
provider: opencode-go

# Fallback for `translation_model` when an offline `apply`/`derive` runs with no
# LLM_MODEL configured. A configured LLM_MODEL always wins.
model: deepseek-v4.1-flash

glossary: config/glossary/zh-Hans.yml
temperature: 0

# How one translation request is cut. `max_blocks` is the number of blocks the
# model gets at once and `max_chars` the size budget of that request; a page
# that exceeds either is sent as several requests (see
# `tools/translate/lib/segments.mjs`). These were command-line flags
# (`--batch`, `--max-chars`) with the same defaults, which is how an oversized
# page used to be split by hand after the endpoint refused it.
segmentation:
  max_blocks: 8
  max_chars: 8000

# How close a link's visible text must be to the target page's English title
# before the label is replaced with that page's Chinese title.
#
# The English source is not consistent - "Quick start" links to a page titled
# "Quick Start guide", "Routing" to "Routing decision" - so an exact comparison
# left English labels pointing at Chinese pages. 0.6 is the Sørensen-Dice
# overlap of the folded word sets: it catches the subtitle/short-form variants
# (>= 0.67) while a single shared word out of three stays below it. Technical
# identifiers (`tmpfs`, `poe-out`) and glossary terms are never re-labelled,
# whatever the score. Read by `tools/translate/lib/links.mjs`; `verify:links`
# counts a similar-but-untranslated label as `failedTitle`.
link_text_similarity: 0.6

# These structures are copied verbatim, never translated.
preserve:
  - frontmatter_keys
  - code_fences
  - inline_code
  - urls
  - cli_paths
  - mdx_component_names
  - image_paths

frontmatter_keys:
  - id
  - slug
  - sidebar_position
  - sidebar_class_name
  - displayed_sidebar
  - tags
  - keywords
  - image
  - draft

# Only these frontmatter values may be translated.
translatable_frontmatter:
  - title
  - sidebar_label
  - description

# Overlays kept as-is instead of being rebuilt from the English source.
#
# `hardware/iot-products/knot-lr9g-kit.md` comes from a bilingual legacy page
# (each paragraph is an English block followed by a `→` Chinese block). Block
# alignment cannot reconstruct it without duplicating text, and the reviewed
# (empty: no overlay is preserved byte for byte any more)
preserve_overlays: []
