# Product-link headings (e.g. [hAP ax](https://mikrotik.com/product/...)).
model_patterns:
  - '^\[[^\]]*\]\(https://mikrotik\.com/product/'

# Version / revision / specification numbers.
version_patterns:
  - '^\d+(\.\d+)+$'
  - '^IPv[46]$'
  - '^802\.\w+$'
  - '^\d+G\s+\S+'
  - '^\d{3}G\s+\S+'

