# Sidebar label policy per section.
#
# The rule that is hard to get right is the Hardware Guides: the first level is a
# *category* ("Switches", "Antennas") and reads better in Chinese, while the
# children are product names ("Wireless Wire Cube", "hAP ax3") that must stay
# verbatim - a translated model name is unrecognisable and cannot be searched.
#
# `docs` is the source of truth for the docs sidebar's category labels; every
# non-CLI category in sidebars.ts / versioned_sidebars is listed there, and
# verify:labels asserts the map exactly covers the tree. Sections not listed
# here keep the default behaviour (translate every label the glossary knows).
schema: 1

# Docs section: the single source of truth for sidebar.docs.category.* keys.
# Keys are Docusaurus category keys from sidebars.ts / versioned_sidebars;
# each value is the reviewed Chinese label emitted into the locale catalogue.
# verify:labels asserts this map covers exactly every non-CLI category in the tree.
