#
# `en` has an empty map on purpose: the English label in sidebars.ts *is* the
# source wording. `zh-Hant` is hand-reviewed Taiwan-Traditional wording -
# script AND terminology (硬體 / 服務品質 / 交換器 / 介面 / 佇列 / ...).
# A locale-aware generator must never fall back from zh-Hant to the legacy
# Simplified values: a missing zh-Hant section is an error, and a key that is
# not listed here keeps its English label.
